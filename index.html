<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Veneto | Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #0b0b0b; --accent: #00d9ff; }
        body { margin: 0; background: var(--bg); color: #e0e0e0; font-family: sans-serif; overflow: hidden; }
        #header { height: 60px; padding: 0 20px; background: #1a1a1a; display: flex; justify-content: space-between; align-items: center; z-index: 2000; position: relative; border-bottom: 1px solid #333; }
        #map { height: calc(100vh - 60px); width: 100%; }
        
        .header-controls { display: flex; align-items: center; gap: 10px; }
        button, select { background: rgba(255,255,255,0.05); color: var(--accent); border: 1px solid var(--accent); padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        /* Visibilità Strade e Etichette */
        .labels-high-visibility { filter: brightness(1.2) contrast(1.4) drop-shadow(1px 1px 1px black); pointer-events: none !important; }
        .blue-roads { filter: invert(100%) hue-rotate(190deg) brightness(1.8) saturate(5) drop-shadow(0 0 2px black) !important; }
        
        .status-badge { font-size: 0.8em; background: #1b5e20; padding: 4px 10px; border-radius: 20px; color: #81c784; }
        
        /* LEGENDA CORRETTA */
        .legend { 
            background: rgba(0,0,0,0.8); 
            padding: 10px; 
            color: white; 
            border-radius: 5px; 
            line-height: 1.5; 
            border: 1px solid var(--accent);
            font-size: 12px;
        }
        .legend i { width: 14px; height: 14px; float: left; margin-right: 8px; margin-top: 2px; border-radius: 2px; }
        
        .spinning { animation: rotate 1s linear infinite; display: inline-block; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="header">
    <div class="header-controls">
        <strong style="color:var(--accent)">RADAR VENETO</strong>
        <select id="map-style" onchange="changeStyle()">
            <option value="dark">NOTTE</option>
            <option value="light">GIORNO</option>
        </select>
        <button onclick="forceUpdate()"><span id="btn-icon">🔄</span> AGGIORNA</button>
    </div>
    <div id="update-time" class="status-badge">Caricamento...</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { zoomControl: true, attributionControl: false }).setView([45.45, 11.9], 8);
    
    map.createPane('radarPane').style.zIndex = 400;
    map.createPane('comuniPane').style.zIndex = 500;
    map.createPane('labelsPane').style.zIndex = 650;

    var baseLayer = L.layerGroup().addTo(map);
    var labelsLayer = L.layerGroup().addTo(map);
    var radarLayerGroup = L.layerGroup().addTo(map);
    var comuniLayer = L.layerGroup().addTo(map);

    const styles = {
        dark: {
            base: 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',
            labels: 'https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',
            class: 'blue-roads',
            comuni: 'rgba(255,255,255,0.15)'
        },
        light: {
            base: 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
            labels: 'https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',
            class: 'labels-high-visibility',
            comuni: 'rgba(0,0,0,0.2)'
        }
    };

    function changeStyle() {
        const s = styles[document.getElementById('map-style').value];
        baseLayer.clearLayers();
        labelsLayer.clearLayers();
        L.tileLayer(s.base).addTo(baseLayer);
        L.tileLayer(s.labels, { pane: 'labelsPane', className: s.class }).addTo(labelsLayer);
        comuniLayer.eachLayer(layer => { layer.setStyle({ color: s.comuni }); });
    }

    async function loadComuni() {
        try {
            const response = await fetch('data/comuni_veneto.json');
            const data = await response.json();
            const s = styles[document.getElementById('map-style').value];
            L.geoJson(data, {
                pane: 'comuniPane',
                style: { color: s.comuni, weight: 2, fillOpacity: 0 }
            }).addTo(comuniLayer);
        } catch (e) { console.error("Errore file comuni:", e); }
    }

    // Funzione Colori Radar (Sincronizzata con la legenda)
    function getColor(d) {
        return d > 60 ? '#ff0000' : 
               d > 40 ? '#ff8c00' : 
               d > 20 ? '#ffd700' : 
               d > 10 ? '#00ff00' : 
               d > 2  ? '#1e90ff' : 
               d > 0.1 ? '#3939b3' : 'transparent';
    }

    async function forceUpdate() {
        const icon = document.getElementById('btn-icon');
        icon.classList.add('spinning');
        try {
            const r = await fetch(`data/pioggia_veneto.json?t=${new Date().getTime()}`);
            const data = await r.json();
            radarLayerGroup.clearLayers();
            L.geoJson(data, {
                pane: 'radarPane',
                style: (f) => ({ 
                    fillColor: getColor(f.properties.mm), 
                    color: getColor(f.properties.mm), 
                    weight: 0.0, 
                    fillOpacity: 0.6 
                }),
                onEachFeature: (f, l) => {
                    // Se non hai il nome nel file pioggia, mostriamo solo i mm
                    l.bindPopup(`<b>Dato Radar</b><br>Accumulo: ${f.properties.mm} mm`);
                }
            }).addTo(radarLayerGroup);
            document.getElementById('update-time').innerText = "LIVE: " + new Date().toLocaleTimeString();
        } catch (e) { console.error(e); }
        setTimeout(() => icon.classList.remove('spinning'), 1000);
    }

    // --- LOGICA DELLA LEGENDA ---
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'legend'),
            grades = [0.1, 2, 10, 20, 40, 60],
            labels = ['<strong>Pioggia 24h (mm)</strong><br>'];
        for (var i = 0; i < grades.length; i++) {
            div.innerHTML +=
                '<i style="background:' + getColor(grades[i] + 0.1) + '"></i> ' +
                grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
        }
        return div;
    };
    legend.addTo(map);

    // Esecuzione Iniziale
    changeStyle();
    loadComuni();
    forceUpdate();
    setInterval(forceUpdate, 300000);
</script>
</body>
</html>
